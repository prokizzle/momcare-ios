# SwiftLint Configuration — MomCare iOS
# SwiftLint owns correctness/style. SwiftFormat owns all formatting.

# Only lint project source, not dependencies or build artifacts
included:
  - MomCare
  - MomCareTests
  - MomCareUITests
  - MomCareWidgetExtension

excluded:
  - Tuist
  - Derived
  - "**/.build"

# Disable rules that duplicate SwiftFormat's formatting
disabled_rules:
  - trailing_comma

# Line length: 120 columns, warning at 120, error at 200
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

# Allow short names (SwiftUI uses single-char generics like V, C)
identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - to
    - x
    - y
    - i

type_name:
  min_length:
    warning: 2

# Function body length
function_body_length:
  warning: 60
  error: 120

# File length
file_length:
  warning: 400
  error: 800

# Type body length
type_body_length:
  warning: 300
  error: 500

# Nesting
nesting:
  type_level: 2
  function_level: 3
